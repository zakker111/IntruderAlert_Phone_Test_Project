
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Intruder Alert
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          echo "Checking Android project..."
          ls -la
          ls -la IntruderAlert
          test -f IntruderAlert/settings.gradle.kts
          test -f IntruderAlert/app/build.gradle.kts
          test -f IntruderAlert/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle -p IntruderAlert --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intruder-alert-debug-apk
          path: IntruderAlert/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
